
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Моя музыка</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d1c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:35px 20px 18px;background:linear-gradient(150deg,#35165d,#100d1c)}
h1{font-size:31px;margin:0 0 5px}
small{color:#b8abc9}
main{padding:20px 18px 190px}
button{border:0;color:white;cursor:pointer;font:inherit}
.add{background:#a65bff;border-radius:17px;padding:16px;width:100%;font-weight:bold;margin-bottom:20px}
input[type=search]{width:100%;background:#252035;border:1px solid #473a5f;color:white;border-radius:13px;padding:15px;font-size:16px}
.tabs{display:flex;gap:9px;margin:20px 0}
.tab{flex:1;padding:12px 5px;border-radius:12px;background:#29233b}
.tab.active{background:#7945bc}
.song{display:flex;align-items:center;gap:12px;background:#1d192c;margin:9px 0;padding:12px;border-radius:15px}
.art{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(130deg,#60359e,#d260b1);font-size:24px;flex-shrink:0}
.info{flex:1;min-width:0;cursor:pointer}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sub{font-size:12px;color:#a9a0bb;margin-top:5px}
.heart{background:none;font-size:24px;padding:7px;color:#b6a6c9}
.heart.liked{color:#fa72b1}
.player{position:fixed;bottom:0;width:100%;background:#21192f;border-top:1px solid #48375f;padding:15px 20px max(20px,env(safe-area-inset-bottom));z-index:3}
.now{text-align:center;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;justify-content:center;gap:27px;align-items:center;margin:13px 0}
.controls button{background:none;font-size:27px}
.controls .play{background:#a65bff;width:56px;height:56px;border-radius:50%}
#seek{width:100%;accent-color:#b476ff}
.times{display:flex;justify-content:space-between;color:#a9a0bb;font-size:11px}
.empty{text-align:center;color:#a9a0bb;padding:35px 8px;line-height:1.7}
</style>
</head>
<body>
<header>
<h1>♫ Моя музыка</h1>
<small>Твоя музыка. Твои правила. Без рекламы.</small>
</header>
<main>
<button class="add" onclick="document.getElementById('files').click()">＋ Добавить музыку</button>
<input id="files" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" multiple hidden>
<input type="search" id="search" placeholder="🔎 Найти песню...">
<div class="tabs">
<button class="tab active" id="allTab" onclick="setTab('all')">Все песни</button>
<button class="tab" id="favTab" onclick="setTab('fav')">♡ Избранное</button>
</div>
<div id="count"></div>
<div id="list"></div>
</main>
<div class="player">
<div class="now" id="now">Выбери песню ♫</div>
<div class="controls">
<button onclick="previous()">⏮</button>
<button class="play" id="playButton" onclick="toggle()">▶</button>
<button onclick="next()">⏭</button>
</div>
<input type="range" id="seek" min="0" max="1000" value="0">
<div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const audio=document.getElementById('audio');
const files=document.getElementById('files');
const list=document.getElementById('list');
const search=document.getElementById('search');
const seek=document.getElementById('seek');
let db,songs=[],current=null,tab='all',objectURL=null;
let favorites=new Set(JSON.parse(localStorage.getItem('musicFavorites')||'[]'));

function openDatabase(){
return new Promise((resolve,reject)=>{
const r=indexedDB.open('MoyaMuzykaDB',1);
r.onupgradeneeded=()=>{
const d=r.result;
if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id'});
};
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}
function requestStore(mode){
return db.transaction('songs',mode).objectStore('songs');
}
function getSongs(){
return new Promise((resolve,reject)=>{
const r=requestStore('readonly').getAll();
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}
function addSong(song){
return new Promise((resolve,reject)=>{
const r=requestStore('readwrite').put(song);
r.onsuccess=resolve;
r.onerror=()=>reject(r.error);
});
}
function format(t){
if(!Number.isFinite(t))return '0:00';
return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
}
function visibleSongs(){
let q=search.value.toLowerCase();
return songs.filter(s=>(tab==='all'||favorites.has(s.id))&&s.name.toLowerCase().includes(q));
}
function render(){
const shown=visibleSongs();
document.getElementById('count').textContent=shown.length+' песен';
list.replaceChildren();
if(!shown.length){
const p=document.createElement('p');
p.className='empty';
p.textContent=songs.length?'Здесь пока нет подходящих песен':'Нажми «Добавить музыку» и выбери песни из приложения «Файлы»';
list.append(p);
}
for(const s of shown){
const row=document.createElement('div');row.className='song';
const art=document.createElement('div');art.className='art';art.textContent='♫';
const info=document.createElement('div');info.className='info';
const name=document.createElement('div');name.className='name';name.textContent=s.name;
const sub=document.createElement('div');sub.className='sub';sub.textContent=current===s.id?'Сейчас играет':'Моя музыка';
info.append(name,sub);info.onclick=()=>playSong(s.id);
const heart=document.createElement('button');
heart.className='heart'+(favorites.has(s.id)?' liked':'');
heart.textContent=favorites.has(s.id)?'♥':'♡';
heart.onclick=()=>favorite(s.id);
row.append(art,info,heart);list.append(row);
}
}
function favorite(id){
favorites.has(id)?favorites.delete(id):favorites.add(id);
localStorage.setItem('musicFavorites',JSON.stringify([...favorites]));
render();
}
function setTab(t){
tab=t;
document.getElementById('allTab').classList.toggle('active',t==='all');
document.getElementById('favTab').classList.toggle('active',t==='fav');
render();
}
async function playSong(id){
const s=songs.find(x=>x.id===id);if(!s)return;
if(objectURL)URL.revokeObjectURL(objectURL);
objectURL=URL.createObjectURL(s.blob);
current=id;audio.src=objectURL;
document.getElementById('now').textContent=s.name;
try{await audio.play()}catch(e){console.log(e)}
updateButton();render();
if('mediaSession' in navigator){
navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Моя музыка'});
navigator.mediaSession.setActionHandler('play',()=>audio.play());
navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
navigator.mediaSession.setActionHandler('nexttrack',next);
navigator.mediaSession.setActionHandler('previoustrack',previous);
}
}
function toggle(){
if(!current){if(songs.length)playSong(songs[0].id);return}
if(audio.paused)audio.play().catch(console.log);
else audio.pause();
}
function updateButton(){
document.getElementById('playButton').textContent=audio.paused?'▶':'⏸';
}
function switchSong(direction){
if(!songs.length)return;
let i=songs.findIndex(s=>s.id===current);
playSong(songs[(i+direction+songs.length)%songs.length].id);
}
function next(){switchSong(1)}
function previous(){
if(audio.currentTime>3){audio.currentTime=0;return}
switchSong(-1);
}
audio.addEventListener('play',updateButton);
audio.addEventListener('pause',updateButton);
audio.addEventListener('ended',next);
audio.addEventListener('timeupdate',()=>{
document.getElementById('currentTime').textContent=format(audio.currentTime);
document.getElementById('duration').textContent=format(audio.duration);
if(Number.isFinite(audio.duration)&&audio.duration>0)
seek.value=Math.round(audio.currentTime/audio.duration*1000);
});
seek.addEventListener('input',()=>{
if(Number.isFinite(audio.duration)&&audio.duration>0)
audio.currentTime=seek.value/1000*audio.duration;
});
search.addEventListener('input',render);
files.addEventListener('change',async()=>{
if(!db)return;
let added=0;
for(const f of files.files){
if(!f.type.startsWith('audio/')&&!/\.(mp3|m4a|wav|aac|ogg)$/i.test(f.name))continue;
const song={id:crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,''),blob:f};
try{await addSong(song);songs.push(song);added++}
catch(e){alert('Не удалось сохранить '+f.name+'. Возможно, закончилось место.');break}
}
files.value='';render();
if(added)alert('Добавлено песен: '+added);
});
async function init(){
try{db=await openDatabase();songs=await getSongs();render()}
catch(e){alert('Не удалось открыть музыкальную библиотеку. Проверь настройки Safari.')}
}
init();
</script>
</body>
</html>
